<!doctype html>
<html lang="zh-CN">
  <head><title>Synthetic conversation</title></head>
  <body>
    <main>
      <article data-message-author-role="user" data-message-id="synthetic-u1">
        <div>What is a synthetic fixture?</div>
        <button>复制</button>
      </article>
      <article data-message-author-role="assistant" data-message-id="synthetic-a1">
        <div>It is generated test content with no real user data.</div>
        <span aria-hidden="true">隐藏反馈标签</span>
      </article>
      <article data-message-author-role="assistant" data-message-id="synthetic-a2">
        <div>Here is a generated one-pixel illustration.</div>
        <img src="/generated-fixture.png" alt="generated fixture" width="64" height="64" />
      </article>
    </main>
  </body>
</html>
